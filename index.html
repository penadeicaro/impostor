<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Monster Among</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;--surface:#16161F;--card:#1E1E2C;
  --accent:#E8FF47;--red:#FF4757;--muted:#4A4A6A;
  --text:#F0F0FF;--sub:#8888AA;--radius:0px;
  --green:#4CAF50;--blue:#4FC3F7;--orange:#FF9800;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'VT323',monospace;
  height:100%;display:flex;flex-direction:column;align-items:center;}
body::before{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;width:100%;max-width:460px;
  height:100%;display:flex;flex-direction:column;overflow:hidden;padding:0 16px;padding-top:var(--header-h,60px);}
.logo{font-family:'VT323',monospace;font-size:2.4rem;
  letter-spacing:2px;text-align:center;padding:10px 0 2px;}
.logo span{color:var(--accent);}
.tagline{text-align:center;color:var(--sub);font-size:1rem;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:10px;}
.screen{display:none;flex-direction:column;gap:10px;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.screen-scroll{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:8px;}
.card{background:var(--card);
  border:2px solid rgba(255,255,255,.18);
  border-right-color:rgba(0,0,0,.6);border-bottom-color:rgba(0,0,0,.6);
  padding:14px;}
.card-label{font-size:1rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--sub);margin-bottom:8px;}
input[type=text],input[type=email],input[type=password]{
  width:100%;background:var(--surface);
  border:2px solid rgba(255,255,255,.18);
  border-right-color:rgba(0,0,0,.7);border-bottom-color:rgba(0,0,0,.7);
  color:var(--text);font-family:'VT323',monospace;
  font-size:1.2rem;padding:10px 14px;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--accent);border-right-color:rgba(232,255,71,.4);border-bottom-color:rgba(232,255,71,.4);}
input::placeholder{color:var(--muted);}
.row{display:flex;gap:10px;}.row input{flex:1;}
.btn{width:100%;padding:12px;border:none;
  font-family:'VT323',monospace;font-size:1.3rem;
  letter-spacing:2px;cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .2s;
  box-shadow:3px 3px 0 rgba(0,0,0,.8);}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.8);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#0D0D14;
  border:2px solid rgba(255,255,255,.5);
  border-right-color:rgba(0,0,0,.4);border-bottom-color:rgba(0,0,0,.4);}
.btn-secondary{background:var(--surface);color:var(--text);
  border:2px solid rgba(255,255,255,.2);
  border-right-color:rgba(0,0,0,.6);border-bottom-color:rgba(0,0,0,.6);}
.btn-danger{background:var(--surface);color:var(--red);
  border:2px solid var(--red);
  border-right-color:rgba(255,71,87,.3);border-bottom-color:rgba(255,71,87,.3);}
.btn-ghost{background:var(--surface);color:var(--sub);font-size:1.1rem;
  border:2px solid rgba(255,255,255,.1);
  border-right-color:rgba(0,0,0,.6);border-bottom-color:rgba(0,0,0,.6);}
.btn-google{background:#fff;color:#1a1a1a;display:flex;align-items:center;
  justify-content:center;gap:10px;font-size:1.1rem;}
.btn-google svg{flex-shrink:0;}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.7rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--muted);opacity:.3;}

.auth-tabs{display:flex;gap:4px;background:var(--surface);border:2px solid rgba(255,255,255,.08);padding:4px;margin-bottom:12px;}
.auth-tab{flex:1;padding:8px;border:none;cursor:pointer;
  font-family:'VT323',monospace;font-size:1.1rem;color:var(--sub);
  background:transparent;transition:background .2s,color .2s;}
.auth-tab.active{background:var(--card);color:var(--text);}

.avatar{width:48px;height:48px;object-fit:cover;image-rendering:pixelated;
  border:2px solid var(--muted);flex-shrink:0;}
.avatar-lg{width:72px;height:72px;object-fit:cover;image-rendering:pixelated;
  border:3px solid var(--accent);display:block;margin:0 auto 12px;}
.avatar-upload-wrap{position:relative;width:72px;margin:0 auto 8px;}
.avatar-upload-wrap .avatar-lg{cursor:pointer;}
.avatar-edit-btn{position:absolute;bottom:0;right:0;background:var(--accent);
  color:#0D0D14;border:none;width:22px;height:22px;
  font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#inp-avatar{display:none;}

.sala-badge{display:flex;align-items:center;justify-content:space-between;
  background:rgba(232,255,71,.07);
  border:2px solid rgba(232,255,71,.35);
  border-right-color:rgba(0,0,0,.6);border-bottom-color:rgba(0,0,0,.6);
  padding:10px 14px;margin-bottom:4px;}
.sala-code{font-family:'VT323',monospace;font-size:2.2rem;
  letter-spacing:6px;color:var(--accent);}
.sala-copy{background:none;border:none;cursor:pointer;color:var(--sub);
  font-size:1rem;font-family:'VT323',monospace;padding:4px 8px;
  transition:color .2s;}
.sala-copy:hover{color:var(--accent);}

.player-list{display:flex;flex-direction:column;gap:7px;}
.player-chip{display:flex;align-items:center;gap:10px;
  padding:0 13px;font-size:.86rem;
  animation:slideIn .22s ease;border:2px solid transparent;
  transition:border-color .3s,box-shadow .3s;
  aspect-ratio:130/35;
  position:relative;overflow:hidden;
  background:var(--surface);}
.player-chip.espectador{opacity:.6;border-style:dashed!important;}
.player-chip.offline{opacity:.4;filter:grayscale(1);}
.vote-row.offline{opacity:.4;filter:grayscale(1);}
.chip-bg{position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;
  pointer-events:none;z-index:0;}
.player-chip img.avatar{flex-shrink:0;position:relative;z-index:1;}
.chip-info{flex:1;display:flex;flex-direction:column;justify-content:space-between;
  min-width:0;position:relative;z-index:1;
  padding:14% 0;}
.chip-name{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;color:#fff!important;}
.chip-rank{display:flex;align-items:center;gap:5px;color:#fff!important;font-size:.85rem;}
.badges-right{position:relative;z-index:1;display:flex;align-items:center;gap:4px;flex-shrink:0;}
@keyframes slideIn{from{opacity:0;transform:translateY(5px);}}
.badge{display:inline-block;padding:2px 8px;font-size:.85rem;
  letter-spacing:1px;text-transform:uppercase;}
.badge-host{background:rgba(232,255,71,.14);color:var(--accent);}
.badge-you{background:rgba(255,255,255,.07);color:var(--sub);}
.badge-spec{background:rgba(79,195,247,.14);color:var(--blue);}
.badges-right{margin-left:auto;display:flex;gap:6px;align-items:center;}
.kick-btn{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:.75rem;padding:2px 5px;transition:color .2s;}
.kick-btn:hover{color:var(--red);}
.score-pill{background:rgba(232,255,71,.1);color:var(--accent);
  padding:2px 8px;font-size:.9rem;border:1px solid rgba(232,255,71,.25);}

.timer-wrap{display:none!important;}
.timer-display{font-family:'VT323',monospace;font-size:2.4rem;
  color:var(--accent);min-width:52px;transition:color .3s;}
.timer-display.urgent{color:var(--red);}
.timer-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.08);overflow:hidden;}
.timer-bar{height:100%;background:var(--accent);
  transition:width 1s linear,background .3s;}
.timer-bar.urgent{background:var(--red);}
.timer-reset-btn{display:none!important;}

#flash-overlay{position:fixed;inset:0;pointer-events:none;z-index:998;
  background:rgba(255,71,87,0);transition:background .1s;}
#flash-overlay.flash{background:rgba(255,71,87,.18);}

.word-box{text-align:center;padding:20px 16px;}
.cat-pill{display:inline-block;background:rgba(232,255,71,.1);color:var(--accent);
  padding:4px 14px;font-size:1rem;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:14px;border:1px solid rgba(232,255,71,.25);}
.word-hidden, .word-revealed {
  font-family:'VT323',monospace;
  font-size:3rem;
  letter-spacing:6px;
}
.word-hidden{font-family:'VT323',monospace;font-size:3rem;
  letter-spacing:6px;color:var(--muted);cursor:pointer;user-select:none;}
.word-revealed{font-family:'VT323',monospace;font-size:3rem;
  color:var(--accent);animation:pop .3s cubic-bezier(.36,2,.6,1);}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.word-hint{font-size:.95rem;color:var(--sub);margin-top:8px;letter-spacing:1px;}
.spec-banner{background:rgba(79,195,247,.08);
  border:2px solid rgba(79,195,247,.25);
  border-right-color:rgba(0,0,0,.5);border-bottom-color:rgba(0,0,0,.5);
  padding:12px 16px;text-align:center;color:var(--blue);
  font-size:1rem;line-height:1.6;}

.vote-grid{display:flex;flex-direction:column;gap:8px;}
:root{ --vote-img-top: 0px; }
.vote-row{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  padding:0 16px;cursor:pointer;
  border:2px solid rgba(255,255,255,.06);
  border-right-color:rgba(0,0,0,.5);border-bottom-color:rgba(0,0,0,.5);
  transition:border-color .15s,background .15s;
  position:relative;overflow:hidden;
  aspect-ratio:130/35;
}
.vote-row-rankbg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:fill;
  pointer-events:none;z-index:0;
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;
  opacity:.6;
}
.vote-row>*:not(.vote-row-rankbg){position:relative;z-index:1;}
.vote-row:hover:not(.already-voted){border-color:rgba(232,255,71,.4);background:rgba(232,255,71,.04);}
.vote-row.voted-by-me{border-color:var(--accent);background:rgba(232,255,71,.06);}
.vote-row.already-voted{cursor:not-allowed;}
.vote-row img.avatar{width:44px;height:44px;flex-shrink:0;}
.vote-bar-wrap{flex:1;height:4px;background:rgba(255,255,255,.08);overflow:hidden;}
.vote-bar{height:100%;background:var(--accent);transition:width .35s ease;}
.vote-count{font-size:1rem;color:var(--sub);min-width:18px;text-align:right;}

.reveal-card{background:var(--card);border-radius:var(--radius);padding:12px;
  display:flex;align-items:center;gap:13px;
  border:1px solid rgba(255,255,255,.06);animation:slideIn .22s ease;}
.reveal-card .av{width:40px;height:40px;border-radius:50%;overflow:hidden;
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;}
.reveal-card .av img{width:100%;height:100%;object-fit:cover;}
.reveal-card .info{flex:1;}
.reveal-card .pname{font-size:1.1rem;}
.reveal-card .pword{color:var(--sub);font-size:.95rem;margin-top:2px;}
.reveal-card.imp{border-color:var(--red);background:rgba(255,71,87,.07);}
.reveal-card.imp .pname{color:var(--red);}
.imp-badge{background:var(--red);color:#fff;padding:2px 8px;
  font-size:.85rem;letter-spacing:1px;text-transform:uppercase;}
.pts-badge{padding:2px 8px;font-size:.9rem;border:1px solid rgba(255,255,255,.1);
  letter-spacing:1px;position:relative;z-index:1;}
.pts-pos{background:rgba(76,175,80,.2);color:var(--green);}
.pts-neg{background:rgba(255,71,87,.2);color:var(--red);}
.pts-zero{background:rgba(255,255,255,.06);color:var(--sub);}

.res-impostor-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:transparent;border:2px solid var(--red);
  padding:20px 16px;
  animation:slideIn .25s ease;
  position:relative;overflow:hidden;
}
.res-impostor-card .res-rank-bg,
.res-player-tile .res-rank-bg{
  position:absolute;left:0;top:0;height:100%;width:auto;
  pointer-events:none;z-index:0;
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;
  opacity:.85;
}
.res-impostor-avatar{width:72px;height:72px;object-fit:cover;image-rendering:pixelated;
  border:3px solid var(--red);position:relative;z-index:1;}
.res-impostor-name{font-family:'VT323',monospace;font-size:1.3rem;
  color:var(--red);text-align:center;position:relative;z-index:1;
  text-shadow:0 1px 4px rgba(0,0,0,.9);}
.res-players-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;
}
.res-player-tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:transparent;padding:12px 8px;
  animation:slideIn .22s ease;
  position:relative;overflow:hidden;
  border:2px solid rgba(255,255,255,.08);
}
.res-player-tile img{width:48px;height:48px;object-fit:cover;image-rendering:pixelated;
  position:relative;z-index:1;}
.res-player-name{font-size:.9rem;color:#fff;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
  position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.9);}
.res-player-name.is-me{color:var(--accent);}

.hist-item{background:var(--surface);padding:10px 12px;border:2px solid rgba(255,255,255,.07);border-right-color:rgba(0,0,0,.5);border-bottom-color:rgba(0,0,0,.5);
  font-size:1rem;border-left:3px solid var(--muted);}
.hist-item.win{border-color:var(--green);}
.hist-item.lose{border-color:var(--red);}
.hist-rodada{font-size:.85rem;color:var(--sub);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase;}
.hist-palavra{font-family:'VT323',monospace;font-size:1.2rem;margin-bottom:2px;}
.hist-detalhe{color:var(--sub);font-size:.95rem;}
.placar-row{display:flex;align-items:center;gap:12px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.05);}
.placar-row:last-child{border:none;}
.placar-rank{font-family:'VT323',monospace;font-size:1.2rem;
  color:var(--sub);min-width:24px;}
.placar-rank.gold{color:#FFD700;}
.placar-nome{flex:1;font-size:1rem;}
.placar-pts{font-family:'VT323',monospace;font-size:1.1rem;color:var(--accent);}

.profile-header{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.profile-header img.avatar{width:44px;height:44px;}
.profile-info{flex:1;}
.profile-name{font-family:'VT323',monospace;font-size:1.2rem;}
.profile-email{font-size:.95rem;color:var(--sub);}

.status{text-align:center;font-size:1rem;color:var(--sub);padding:4px;min-height:20px;}
.status.err{color:var(--red);}
.status.ok{color:var(--green);}
.words-info{font-size:.85rem;color:var(--sub);text-align:center;padding:3px 0;}
.words-info.ok{color:var(--green);}
.words-info.err{color:var(--red);}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--accent);margin-right:6px;animation:pulse 1.4s ease infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;
  align-items:center;justify-content:center;z-index:999;
  font-family:'VT323',monospace;font-size:1.3rem;color:var(--sub);
  letter-spacing:3px;text-transform:uppercase;transition:opacity .4s;}
#loader.hide{opacity:0;pointer-events:none;}
.tabs{display:flex;gap:4px;background:var(--surface);border:2px solid rgba(255,255,255,.07);padding:4px;}
.tab{flex:1;padding:7px;border:none;cursor:pointer;
  font-family:'VT323',monospace;font-size:1.1rem;color:var(--sub);
  background:transparent;transition:background .2s,color .2s;}
.tab.active{background:var(--card);color:var(--text);border-bottom:2px solid var(--accent);}
.tab-content{display:none;flex-direction:column;gap:8px;}
.tab-content.active{display:flex;}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);
  display:inline-block;margin-right:6px;}
.conn-dot.online{background:var(--green);}
.link-btn{background:none;border:none;color:var(--sub);cursor:pointer;
  font-family:'VT323',monospace;font-size:1rem;text-decoration:underline;
  padding:0;}
.link-btn:hover{color:var(--accent);}

.btn-pair-row{display:flex;gap:8px;}
.btn-pair-row .btn{flex:1;}

.player-chip .chip-name,
.player-chip .chip-name span,
.player-chip .chip-rank,
.player-chip .chip-rank span,
.player-chip .score-pill,
.player-chip .badge{
  color:#fff!important;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.7)!important;
}
.player-chip .score-pill{background:rgba(0,0,0,.45)!important;}
.player-chip .badge{background:rgba(0,0,0,.45)!important;}
.player-chip .kick-btn{color:rgba(255,255,255,.5)!important;text-shadow:none!important;}
.player-chip .kick-btn:hover{color:#FF4757!important;}

.player-chip.offline{opacity:.4;filter:grayscale(1);}
.vote-row.offline{opacity:.4;filter:grayscale(1);}
.offline-label{font-family:'VT323',monospace;font-size:.8rem;color:#FF9800;
  letter-spacing:1px;display:inline-flex;align-items:center;gap:4px;margin-left:4px;}
@keyframes spin{to{transform:rotate(360deg)}}
.offline-spinner{display:inline-block;width:10px;height:10px;
  border:2px solid rgba(255,152,0,.3);border-top-color:#FF9800;
  border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}

.placar-pts,.placar-rank,.score-pill,.pts-badge,.chip-rank span{
  font-family:'VT323',monospace!important;}

.devlog-hidden #devlog-panel{display:none!important;}
#devlog-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:9999;
  background:rgba(0,0,0,.92);border-top:2px solid #E8FF47;
  font-family:monospace;font-size:11px;
  max-height:38vh;display:flex;flex-direction:column;
}
#devlog-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 8px;background:#111;border-bottom:1px solid #333;
  cursor:pointer;user-select:none;flex-shrink:0;
}
#devlog-bar span{color:#E8FF47;letter-spacing:1px;font-size:11px;}
#devlog-bar .devlog-btns{display:flex;gap:6px;}
#devlog-bar button{background:#222;border:1px solid #444;color:#aaa;
  font-size:10px;padding:2px 7px;cursor:pointer;font-family:monospace;}
#devlog-bar button:hover{color:#E8FF47;border-color:#E8FF47;}
#devlog-body{overflow-y:auto;flex:1;padding:4px 8px 6px;}
#devlog-body.collapsed{display:none;}
.dlog{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;gap:6px;align-items:flex-start;line-height:1.4;}
.dlog-time{color:#555;flex-shrink:0;min-width:68px;}
.dlog-uid{color:#4FC3F7;flex-shrink:0;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dlog-msg{color:#ddd;word-break:break-all;}
.dlog.err .dlog-msg{color:#FF4757;}
.dlog.warn .dlog-msg{color:#FF9800;}
.dlog.ok .dlog-msg{color:#4CAF50;}
.dlog.info .dlog-msg{color:#4FC3F7;}
.dlog.auth .dlog-msg{color:#E8FF47;}

.player-list, .vote-grid, #hist-list, #placar-list, .tab-content, #s-setup {
  scrollbar-width:none;}
.player-list::-webkit-scrollbar, .vote-grid::-webkit-scrollbar,
#hist-list::-webkit-scrollbar, #placar-list::-webkit-scrollbar,
.tab-content::-webkit-scrollbar, #s-setup::-webkit-scrollbar {display:none;}
</style>
</head>
<body>
<div id="flash-overlay"></div>
<div id="loader">carregando…</div>
<img src="header.png" alt="Impostor" id="site-header" style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:block;z-index:0;pointer-events:none;">
<div class="wrap">
  <!-- ══ AUTH ══ -->
  <div id="s-auth" class="screen">
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Entrar</button>
        <button class="auth-tab" onclick="switchAuthTab('cadastro')">Cadastrar</button>
      </div>

function devlog(msg, tipo='info'){
  if(!DEVLOG_ENABLED) return;
  const body = document.getElementById('devlog-body');
  if(body){
    const now = new Date();
    const ts  = now.toTimeString().slice(0,8)+'.'+String(now.getMilliseconds()).padStart(3,'0');
    const row = document.createElement('div');
    row.className = 'dlog ' + tipo;
    row.innerHTML = `<span class="dlog-time">${ts}</span><span class="dlog-uid">[${_DEVLOG_SESSION}/${_devlogUidLabel()}]</span><span class="dlog-msg">${msg}</span>`;
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
    _devlogCount++;
    const cnt = document.getElementById('devlog-count');
    if(cnt) cnt.textContent = `(${_devlogCount})`;
  }
  console[tipo==='err'?'error':tipo==='warn'?'warn':'log'](`[IMP-${_DEVLOG_SESSION}] ${msg}`);
  try{
    if(typeof db !== 'undefined'){
      const ref = db.ref('_devlog').push();
      ref.set({
        ts: Date.now(),
        session: _DEVLOG_SESSION,
        uid: _devlogUidLabel(),
        msg, tipo
      }).catch(()=>{});
      db.ref('_devlog').once('value', snap=>{
        if(snap.numChildren && snap.numChildren() > 200){
          const keys = Object.keys(snap.val()||{});
          keys.slice(0, keys.length-200).forEach(k=> db.ref(`_devlog/${k}`).remove().catch(()=>{}));
        }
      }).catch(()=>{});
    }
  }catch(_){}
}

  const body = document.getElementById('devlog-body');

function devlogCopy(){
  const body = document.getElementById('devlog-body');
  if(!body) return;
  const linhas = [...body.querySelectorAll('.dlog')].map(r=>r.textContent).join('\n');

let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, duration, vol=0.18, delay=0){
  try{
    const ctx=getAudio();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type=type; osc.frequency.setValueAtTime(freq, ctx.currentTime+delay);
    gain.gain.setValueAtTime(0, ctx.currentTime+delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime+delay+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+duration);
    osc.start(ctx.currentTime+delay);
    osc.stop(ctx.currentTime+delay+duration+0.05);
  }catch(e){}
}

function playNoise(duration, vol=0.12, delay=0){
  try{
    const ctx=getAudio();
    const buf=ctx.createBuffer(1,ctx.sampleRate*duration,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();
    const filter=ctx.createBiquadFilter();
    const gain=ctx.createGain();
    src.buffer=buf;
    filter.type='bandpass'; filter.frequency.value=400;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(vol, ctx.currentTime+delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+duration);
    src.start(ctx.currentTime+delay);
  }catch(e){}
}

  {min:30,  max:79,  tier:2, title:'Lobisomem',  img:'lobisomem.png',  color:'#0072ff'},

  {min:300, max:Infinity, tier:5, title:'Alien', img:'alien.png',      color:'#06ff00'},
];

function getPrestige(pts){
  const p=Math.max(0,pts||0);
  return PRESTIGE_TIERS.find(t=>p>=t.min&&p<=t.max)||PRESTIGE_TIERS[0];
}

function getPrestigeStyle(pts){
  const p=Math.max(0,pts||0);
  const t=getPrestige(p);
  const nextTier=PRESTIGE_TIERS[t.tier]||null;
  const ptsParaProx=nextTier?nextTier.min-p:0;
  const tierRange=nextTier?(nextTier.min-t.min):1;
  const progressPct=nextTier?Math.min(100,Math.round((p-t.min)/tierRange*100)):100;
  return {tier:t.tier, title:t.title, color:t.color, img:t.img,
    pts:p, ptsParaProx, progressPct, isMax:t.tier===5};
}

  let prof = null;
  for(let i=0; i<3; i++){
    try{ prof = await get(`users/${uid}`); } catch(e){}

    if(i<2) await new Promise(r=>setTimeout(r, 800));
  }
  const nomeFirebase = ME.displayName || ME.email?.split('@')[0] || '';
  if(!prof){
    if(!nomeFirebase) throw new Error('Sem conexão para carregar perfil');
    prof = { nome:nomeFirebase, avatarUrl:ME.photoURL||'', placarTotal:0, criadoEm:Date.now() };
    await set(`users/${uid}`, prof);
  } else if(!prof.nome && nomeFirebase){

    await upd(`users/${uid}`, { nome: nomeFirebase });
  }
  return prof;
}

function comprimirImagem(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onerror=()=>rej(new Error('Falha ao ler o arquivo.'));
    reader.onload=ev=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('Imagem inválida ou corrompida.'));
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const sz=128;
        canvas.width=sz; canvas.height=sz;
        const ctx=canvas.getContext('2d');
        const s=Math.min(img.width,img.height);
        const sx=(img.width-s)/2, sy=(img.height-s)/2;
        ctx.drawImage(img,sx,sy,s,s,0,0,sz,sz);
        canvas.toBlob(blob=>{
          if(!blob) return rej(new Error('Falha ao comprimir imagem.'));
          res(blob);
        },'image/jpeg',0.72);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadAvatar(input){
  const file=input.files[0];
  input.value='';
  if(!file) return;
  if(file.size>5*1024*1024) return setErr('st-nome','Imagem muito grande (máx 5MB).');

  const statusEl=$('avatar-status');
  statusEl.textContent='Comprimindo…';

  try{
    const blob=await comprimirImagem(file);
    statusEl.textContent='Enviando…';
    const uid=ME.uid;
    const ts=Date.now();
    const path=`avatares/${uid}/${ts}.jpg`;
    const storageRef=storage.ref(path);

    const url=await Promise.race([
      (async()=>{
        const snap=await storageRef.put(blob,{contentType:'image/jpeg'});
        return await snap.ref.getDownloadURL();
      })(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Tempo limite excedido. Verifique sua conexão.')),20000))
    ]);

    await upd(`users/${uid}`,{avatarUrl:url});
    ME_PROFILE.avatarUrl=url;
    $('setup-avatar').src=url;
    statusEl.textContent='';
    setOk('st-nome','Avatar updated!');
    setTimeout(()=>clearErr('st-nome'),2500);

    if(SALA){
      await upd(`salas/${SALA}/jogadores/${idKey(uid)}`,{avatarUrl:url});
    }
  }catch(e){
    const msg=e.code=='storage/unauthorized' ? 'Sem permissão.' : e.message||'Erro no upload.';
    statusEl.textContent='';
    setErr('st-nome', msg);
  }
}

    stopFlashPulse();
  }

  if(prev?.fase!=='revealed' && fase==='revealed'){
    (async()=>{
      try{
        const fonteJogadores=Object.keys(_snapshot).length>0?_snapshot:_jogadores;
        const ativos=Object.values(fonteJogadores).filter(j=>!j.espectador);
        const eu=ativos.find(j=>j.id===ME.uid);
        if(!eu||eu.espectador) return;
        const contagem={};
        Object.values(_votos).forEach(v=>{contagem[v.votadoId]=(contagem[v.votadoId]||0)+1;});
        const {cenarioImpostor,cenarioJogadores}=calcularResultado(ativos,contagem,info.impostorId,_votos);
        const isImp=ME.uid===info.impostorId;
        const pts=isImp?cenarioImpostor.pts:(cenarioJogadores[ME.uid]?.pts||0);
        if(pts!==0){
          const updatedVal = Math.max(0, (ME_PROFILE?.placarTotal||0) + pts);
          await upd(`users/${ME.uid}`,{placarTotal:updatedVal});
        }
      }catch(e){ console.warn(e); }
    })();
  }

  if(prev?.fase==='lobby' && fase==='questioning') SFX.sortear();
  if(prev?.fase==='questioning' && fase==='playing') SFX.palavra();
  if(prev?.fase==='playing' && fase==='voting') SFX.votacaoAberta();

  if((fase==='playing'||fase==='voting'||fase==='revealed') && !_assignments){
    Promise.all([
      get(`salas/${SALA}/assignments`),
      get(`salas/${SALA}/snapshot`)
    ]).then(([a,s])=>{
      _assignments=a||{};
      _snapshot=s||{};
      renderFase();
    });
    return;
  }
  if(fase==='lobby'){ _assignments=null; meuVoto=null; myWord=''; _snapshot={}; }
  renderFase();
}

function onTimerChanged(data){
  if(!data) return;
  if(data.ts===lastTimerTs && timerRunning) return;
  lastTimerTs=data.ts;
  if(data.ativo){
    iniciarTimerLocal(data.ts);
  } else {
    pararTimerLocal();
    $('timer-display').textContent='15';
    $('timer-bar').style.width='100%';
    $('timer-display').classList.remove('urgent');
    $('timer-bar').classList.remove('urgent');
    $('timer-label').textContent='aguardando host…';
  }
}

function iniciarTimerLocal(startTs){
  pararTimerLocal();
  timerRunning=true;
  const DURACAO=15;
  let lastTickSeg=-1;
  function tick(){
    const elapsed=(serverNow()-startTs)/1000;
    const restante=Math.max(0, DURACAO-elapsed);
    const segsDisplay=Math.ceil(restante);
    const urgent=restante<=5;

    $('timer-display').textContent=segsDisplay;
    $('timer-bar').style.width=(restante/DURACAO*100)+'%';
    $('timer-display').classList.toggle('urgent',urgent);
    $('timer-bar').classList.toggle('urgent',urgent);
    $('timer-label').textContent=timerRunning?'respondendo…':'';

    setFlashByRestante(restante);

    if(restante>0 && segsDisplay!==lastTickSeg){
      lastTickSeg=segsDisplay;
      SFX.tick(restante);
    }

    if(restante<=0){
      setTimeout(()=>{ stopFlashPulse(); },300);
      pararTimerLocal();
      $('timer-display').textContent='15';
      $('timer-bar').style.width='100%';
      $('timer-display').classList.remove('urgent');
      $('timer-bar').classList.remove('urgent');
      $('timer-label').textContent='tempo esgotado!';
      return;
    }
    timerInterval=requestAnimationFrame(tick);
  }
  timerInterval=requestAnimationFrame(tick);
}

function setFlashByRestante(restante){
  const ov=$('flash-overlay');
  if(!ov) return;
  if(restante<=0){ ov.classList.add('flash'); return; }
  if(restante>=5){ ov.classList.remove('flash'); return; }
  const frac=restante-Math.floor(restante);
  frac>=0.5 ? ov.classList.add('flash') : ov.classList.remove('flash');
}
function stopFlashPulse(){
  if(flashPulseInterval){ clearInterval(flashPulseInterval); flashPulseInterval=null; }
  const ov=$('flash-overlay');
  if(ov) ov.classList.remove('flash');
}
function startFlashPulse(){
  if(flashPulseInterval) return;
  let on=false;
  flashPulseInterval=setInterval(()=>{
    on=!on;
    const ov=$('flash-overlay');
    if(ov) on ? ov.classList.add('flash') : ov.classList.remove('flash');
  },450);
}
function pararTimerLocal(){
  if(timerInterval) cancelAnimationFrame(timerInterval);
  timerInterval=null;
  timerRunning=false;
  stopFlashPulse();
}

function renderVoteGrid(gridId){
  const fonteJogadores=Object.keys(_snapshot).length>0?_snapshot:_jogadores;
  const ativos=Object.values(fonteJogadores).filter(j=>!j.espectador).sort((a,b)=>a.ts-b.ts);

  const contagem={};
  Object.values(_votos).forEach(v=>{contagem[v.votadoId]=(contagem[v.votadoId]||0)+1;});

  const grid=$(gridId);
  grid.innerHTML='';
  ativos.forEach(j=>{
    const jaVotou=!!_votos[idKey(j.id)];
    const nome=j.nome||'(sem nome)';
    const qtd=contagem[j.id]||0;
    const pct=totalVotos>0?Math.round(qtd/totalVotos*100):0;
    const pts=j.placarTotal||0;
    const avStyle=avatarTierStyle(pts);
    const rankStyle=getPrestigeStyle(pts);
    const row=document.createElement('div');
    row.className='vote-row'+(meuVoto===j.id?' voted-by-me':'')+(j.online===false?' offline':'');
    row.onclick=()=>{ SFX.voto(); votar(j.id,j.nome); };
    const offlineBadge=j.online===false?'<span class="offline-label"><span class="offline-spinner"></span>offline</span>':'';
    const votantes = Object.entries(_votos)
      .filter(([,v]) => v.votadoId === j.id)
      .map(([k]) => {
        const uid = keyToId(k);
        return Object.values(fonteJogadores).find(x => x.id === uid) || null;
      })
      .filter(Boolean);

    const BASE_SIZE = 30;
    const MIN_OVERLAP = 2;
    const MAX_OVERLAP = 14;
    const overlap = votantes.length <= 4
      ? MIN_OVERLAP
      : Math.min(MAX_OVERLAP, MIN_OVERLAP + (votantes.length - 4) * 3);

    const miniFotos = votantes.map((vt, i) => {
      const right = i * (BASE_SIZE - overlap);
      return `<img src="${avatarImg(vt.avatarUrl)}" alt=""
        onerror="this.src='${AVATAR_PLACEHOLDER}'"
        style="position:absolute;bottom:4px;right:${right}px;
        width:${BASE_SIZE}px;height:${BASE_SIZE}px;
        object-fit:cover;image-rendering:pixelated;
        border:1px solid rgba(0,0,0,.6);
        border-radius:2px;z-index:${10+i};">`;
    }).reverse().join('');

    const miniFotosWrap = votantes.length
      ? `<div style="position:absolute;bottom:0;right:0;
          height:100%;pointer-events:none;z-index:2;
          width:${Math.max(BASE_SIZE, BASE_SIZE + (votantes.length-1)*(BASE_SIZE-overlap))}px;">
          ${miniFotos}
        </div>`
      : '';
    row.innerHTML=`
      <img class="vote-row-rankbg" src="${rankStyle.img}" alt="">
      <div style="position:relative;z-index:1;flex-shrink:0;width:22px;display:flex;align-items:center;justify-content:center;">
        ${jaVotou
          ? '<svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="2" fill="none" stroke="#4CAF50" stroke-width="2"/><polyline points="4,10 8,14 16,6" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : '<svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="2" fill="none" stroke="#4A4A6A" stroke-width="2"/></svg>'
        }
      </div>
      <img class="avatar" src="${avatarImg(j.avatarUrl)}" alt=""
        onerror="this.src='${AVATAR_PLACEHOLDER}'" style="${avStyle}">
      <div style="flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;">
        <div style="font-size:1.1rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)">${nomeHTML(nome,pts)}${j.id===ME.uid?' <small style="color:var(--sub)">(você)</small>':''}${offlineBadge}</div>
        <div style="font-size:.85rem;color:${rankStyle.color};text-shadow:0 1px 3px rgba(0,0,0,.9);letter-spacing:.5px;text-transform:uppercase">${rankStyle.title} · ${pts}pt</div>
        <div style="height:3px;background:rgba(255,255,255,.08);overflow:hidden;width:100%;max-width:120px">
          <div style="height:100%;background:${rankStyle.color};width:${pct}%;transition:width .35s ease;opacity:.8"></div>
        </div>
      </div>
      ${miniFotosWrap}`;
    grid.appendChild(row);
  });

  const statusEl=$(gridId==='q-vote-grid'?'q-vote-status':'vote-status-txt');
  if(statusEl) statusEl.textContent=`${totalVotos} de ${ativos.length} votos computados`;
}

async function sortear(){

  $('btn-sortear').disabled=true;
  try{

    const cat=cats[Math.floor(Math.random()*cats.length)];
    const pals=banco[cat];
    const palavra=pals[Math.floor(Math.random()*pals.length)];

    const lista=Object.values(_jogadores).sort((a,b)=>a.ts-b.ts);
    const ativos=lista.filter(j=>j.online!==false);
    if(ativos.length<2) throw new Error('Mínimo 2 jogadores online.');

    const impIdx=Math.floor(Math.random()*ativos.length);
    const imp=ativos[impIdx];

    const assignments={};
    const snapObj={};
    lista.forEach(j=>{
      const isSpec=j.online===false;
      snapObj[idKey(j.id)]={...j, espectador:isSpec};
      if(!isSpec){
        assignments[idKey(j.id)]=(j.id===imp.id)?'IMPOSTOR':palavra;
      }
    });

    const rodada=(_info.rodada||0)+1;

    await del(`salas/${SALA}/votos`);
    await set(`salas/${SALA}/assignments`, assignments);
    await set(`salas/${SALA}/snapshot`, snapObj);
    await set(`salas/${SALA}/timer`, {ts:0, ativo:false});
    await upd(`salas/${SALA}/info`, {
      fase:'questioning',
      categoria:cat,
      palavra,
      impostorId:imp.id,
      impostorNome:imp.nome,
      votacaoAberta:true,
      rodada
    });
  }catch(e){ alert(e.message); $('btn-sortear').disabled=false; }
}

function calcularResultado(ativos, contagem, impId, todosVotos){
  const totalAtivos=ativos.length;
  const totalVotosEfetuados=Object.keys(todosVotos).length;
  const votosImp=contagem[impId]||0;

  let impPego=false;
  let maisVotadoId=null;
  let maxVotos=-1;
  let empate=false;

  Object.entries(contagem).forEach(([id,qtd])=>{
    if(qtd>maxVotos){ maxVotos=qtd; maisVotadoId=id; empate=false; }
    else if(qtd===maxVotos){ empate=true; }
  });

  if(!empate && maisVotadoId===impId && maxVotos>0) impPego=true;

  let cenarioImpostor={pts:0, txt:''};
  let cenarioJogadores={};

  ativos.forEach(j=>{ if(j.id!==impId) cenarioJogadores[j.id]={pts:0, txt:''}; });

  if(impPego){
    const todosAcertaram = (votosImp === totalAtivos - 1);
    const maioriaAcertou = (votosImp > (totalAtivos - 1)/2);

    if(todosAcertaram){
      cenarioImpostor={pts:PTS.imp_pego_unanimidade, txt:`Pego por unanimidade! (${PTS.imp_pego_unanimidade}pt)`};
      ativos.forEach(j=>{
        if(j.id!==impId){
          const v=todosVotos[idKey(j.id)];
          if(v&&v.votadoId===impId) cenarioJogadores[j.id]={pts:PTS.acertou_unanimidade, txt:`Acertou com unanimidade! (+${PTS.acertou_unanimidade}pt)`};
          else                      cenarioJogadores[j.id]={pts:PTS.errou_impegou, txt:`Errou o voto. (${PTS.errou_impegou}pt)`};
        }
      });
    } else if(maioriaAcertou){
      cenarioImpostor={pts:PTS.imp_pego_maioria, txt:`Pego pela maioria. (${PTS.imp_pego_maioria}pt)`};
      ativos.forEach(j=>{
        if(j.id!==impId){
          const v=todosVotos[idKey(j.id)];
          if(v&&v.votadoId===impId) cenarioJogadores[j.id]={pts:PTS.acertou_maioria, txt:`Acertou com a maioria! (+${PTS.acertou_maioria}pt)`};
          else if(!v)               cenarioJogadores[j.id]={pts:PTS.absteve_impegou, txt:`Não votou. (+${PTS.absteve_impegou}pt)`};
          else                      cenarioJogadores[j.id]={pts:PTS.errou_impegou, txt:`Errou o voto. (${PTS.errou_impegou}pt)`};
        }
      });
    } else {
      cenarioImpostor={pts:PTS.imp_pego_minoria, txt:`Pego por minoria! (${PTS.imp_pego_minoria}pt)`};
      ativos.forEach(j=>{
        if(j.id!==impId){
          const v=todosVotos[idKey(j.id)];
          if(v&&v.votadoId===impId) cenarioJogadores[j.id]={pts:PTS.acertou_minoria, txt:`Acertou heroico em minoria! (+${PTS.acertou_minoria}pt)`};
          else if(!v)               cenarioJogadores[j.id]={pts:PTS.absteve_impegou, txt:`Não votou. (+${PTS.absteve_impegou}pt)`};
          else                      cenarioJogadores[j.id]={pts:PTS.errou_impegou, txt:`Errou o voto. (${PTS.errou_impegou}pt)`};
        }
      });
    }
  } else {
    if(votosImp===0){
      cenarioImpostor={pts:PTS.imp_escapou_zerovoto, txt:`Escapou indetectável! (+${PTS.imp_escapou_zerovoto}pt)`};
    } else if(empate && maisVotadoId===impId){
      cenarioImpostor={pts:PTS.imp_escapou_empate, txt:`Escapou por empate nos votos! (+${PTS.imp_escapou_empate}pt)`};
    } else {
      cenarioImpostor={pts:PTS.imp_escapou_minoria, txt:`Escapou enganando a banca! (+${PTS.imp_escapou_minoria}pt)`};
    }
    ativos.forEach(j=>{
      if(j.id!==impId){
        const v=todosVotos[idKey(j.id)];
        if(v&&v.votadoId===impId) cenarioJogadores[j.id]={pts:PTS.acertou_escapou, txt:`Você acertou, mas ele escapou. (${PTS.acertou_escapou}pt)`};
        else if(!v)               cenarioJogadores[j.id]={pts:PTS.absteve_escapou, txt:`Não votou e ele escapou. (${PTS.absteve_escapou}pt)`};
        else                      cenarioJogadores[j.id]={pts:PTS.errou_escapou, txt:`Foi enganado pelo impostor. (${PTS.errou_escapou}pt)`};
      }
    });
  }
  return {impPego, cenarioImpostor, cenarioJogadores};
}

async function revelarImpostor(){
  if(_info.host!==ME.uid) return;
  pararTimerLocal();
  pararQTimerLocal();
  stopFlashPulse();

  const impId=_info.impostorId;
  const fonteJogadores=Object.keys(_snapshot).length>0?_snapshot:_jogadores;
  const ativos=Object.values(fonteJogadores).filter(j=>!j.espectador);

  const contagem={};
  Object.values(_votos).forEach(v=>{contagem[v.votadoId]=(contagem[v.votadoId]||0)+1;});

  const {impPego,cenarioImpostor,cenarioJogadores}=calcularResultado(ativos,contagem,impId,_votos);

  try{
    const batch={};
    ativos.forEach(j=>{
      const k=idKey(j.id);
      const ptsRodada=(j.id===impId)?cenarioImpostor.pts:(cenarioJogadores[j.id]?.pts||0);
      const novoPlacar=Math.max(0,(_jogadores[k]?.placar||0)+ptsRodada);
      batch[`jogadores/${k}/placar`]=novoPlacar;
    });

    const histRef=db.ref(`salas/${SALA}/historico`).push();
    await histRef.set({
      rodada:_info.rodada,
      categoria:_info.categoria,
      palavra:_info.palavra,
      impostorNome:_info.impostorNome,
      impostorId:impId,
      pego:impPego,
      ts:Date.now()
    });

    batch['info/fase']='revealed';
    batch['info/votacaoAberta']=false;
    await upd(`salas/${SALA}`, batch);
  }catch(e){ alert('Erro ao revelar: '+e.message); }
}

function renderResultado(){
  if(document.querySelector('.screen.active')?.id!=='s-resultado'){
    showScreen('s-resultado');
    resultadoSomTocado=false;
  }

  const impId=_info.impostorId;
  const fonteJogadores=Object.keys(_snapshot).length>0?_snapshot:_jogadores;
  const ativos=Object.values(fonteJogadores).filter(j=>!j.espectador);

  const contagem={};
  Object.values(_votos).forEach(v=>{contagem[v.votadoId]=(contagem[v.votadoId]||0)+1;});

  const {impPego,cenarioImpostor,cenarioJogadores}=calcularResultado(ativos,contagem,impId,_votos);

  if(!resultadoSomTocado){
    resultadoSomTocado=true;
    const souImp=ME.uid===impId;
    if(impPego) souImp?SFX.derrota():SFX.vitoria();
    else          souImp?SFX.vitoria():SFX.derrota();
  }

  const impCardStyle=getPrestigeStyle(_jogadores[idKey(impId)]?.placarTotal||0);
  const container=$('res-list');
  container.innerHTML=`
    <div class="res-impostor-card" style="border-color:${impPego?'var(--green)':'var(--red)'}">
      <img class="res-rank-bg" src="${impCardStyle.img}" alt="">
      <div style="font-size:.85rem;letter-spacing:2px;text-transform:uppercase;color:#fff;position:relative;z-index:1;text-shadow:0 1px 3px #000">O Impostor era</div>
      <img class="res-impostor-avatar" src="${avatarImg(_snapshot[idKey(impId)]?.avatarUrl)}" alt="" onerror="this.src='${AVATAR_PLACEHOLDER}'" style="border-color:${impPego?'var(--green)':'var(--red)'}">
      <div class="res-impostor-name" style="color:${impPego?'var(--green)':'var(--red)'}">${_info.impostorNome}</div>
      <div style="font-size:1.1rem;color:#fff;position:relative;z-index:1;text-shadow:0 1px 4px #000;text-align:center;margin-top:2px;font-weight:bold;">
        Palavra: <span style="color:var(--accent)">${_info.palavra||'—'}</span>
      </div>
      <div style="font-size:.9rem;color:#fff;position:relative;z-index:1;text-shadow:0 1px 3px #000;text-align:center;margin-top:4px;opacity:.95">
        ${cenarioImpostor.txt}
      </div>
    </div>
    <div class="card-label" style="margin-top:6px;margin-bottom:4px;">Sobreviventes</div>
    <div class="res-players-grid"></div>`;

  const grid=container.querySelector('.res-players-grid');
  ativos.forEach(j=>{
    if(j.id===impId) return;
    const c=cenarioJogadores[j.id]||{pts:0, txt:''};
    const pillClass=c.pts>0?'pts-pos':c.pts<0?'pts-neg':'pts-zero';
    const sinal=c.pts>0?'+':'';
    const tileStyle=getPrestigeStyle(_jogadores[idKey(j.id)]?.placarTotal||0);
    const tile=document.createElement('div');
    tile.className='res-player-tile';
    tile.innerHTML=`
      <img class="res-rank-bg" src="${tileStyle.img}" alt="">
      <img src="${avatarImg(j.avatarUrl)}" alt="" onerror="this.src='${AVATAR_PLACEHOLDER}'" style="${avatarTierStyle(_jogadores[idKey(j.id)]?.placarTotal||0)}">
      <div class="res-player-name${j.id===ME.uid?' is-me':''}">${j.nome}</div>
      <span class="pts-badge ${pillClass}">${sinal}${c.pts}pt</span>`;
    grid.appendChild(tile);
  });

  const isHost=_info.host===ME.uid;
  $('btn-nova').style.display=isHost?'':'none';

  renderPlacar();
}

function renderPlacar(){
  const lista=Object.values(_jogadores).sort((a,b)=>(b.placar||0)-(a.placar||0));
  const container=$('placar-list');
  container.innerHTML='';
  lista.forEach((j,idx)=>{
    const row=document.createElement('div');
    row.className='placar-row';
    const isGold=idx===0&&(j.placar||0)>0;
    const rankTxt=isGold?'🥇':`#${idx+1}`;
    row.innerHTML=`
      <span class="placar-rank${isGold?' gold':''}">${rankTxt}</span>
      <span class="placar-nome">${j.nome}${j.id===ME.uid?' <small style="color:var(--sub)">(você)</small>':''}</span>
      <span class="placar-pts">${j.placar||0} pt</span>`;
    container.appendChild(row);
  });
}

function renderHistorico(){
  const lista=Object.values(_historico).sort((a,b)=>b.ts-a.ts);
  const container=$('hist-list');
  container.innerHTML='';
  if(!lista.length){ container.innerHTML='<div style="color:var(--muted);text-align:center;padding:12px">Nenhuma rodada registrada.</div>'; return; }
  lista.forEach(h=>{
    const item=document.createElement('div');
    item.className='hist-item '+(h.pego?'win':'lose');
    item.innerHTML=`
      <div class="hist-rodada">Rodada ${h.rodada} · ${h.categoria||'—'}</div>
      <div class="hist-palavra">${h.palavra||'—'}</div>
      <div class="hist-detalhe">Impostor: <strong>${h.impostorNome||'?'}</strong> (${h.pego?'PEGO':'ESCAPOU'})</div>`;
    container.appendChild(item);
  });
}

async function novaRodada(){
  if(_info.host!==ME.uid) return;
  SFX.novaRodada();
  try{
    await del(`salas/${SALA}/votos`);
    await del(`salas/${SALA}/assignments`);
    await del(`salas/${SALA}/snapshot`);
    await set(`salas/${SALA}/timer`, {ts:0, ativo:false});
    await upd(`salas/${SALA}/info`, {
      fase:'lobby',
      categoria:'', palavra:'',
      impostorId:'', impostorNome:'',
      votacaoAberta:false
    });
  }catch(e){ alert(e.message); }
}

async function kickar(uid){
  if(_info.host!==ME.uid||uid===ME.uid) return;
  if(confirm('Remover este jogador da sala?')){
    try{ await del(`salas/${SALA}/jogadores/${idKey(uid)}`); }catch(e){}
  }
}

_bindInputListeners();
carregarPalavras().catch(()=>{});
</script>
